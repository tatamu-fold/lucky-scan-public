name: Build

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.set-timestamp.outputs.timestamp }}
      timestamp_int: ${{ steps.set-timestamp.outputs.timestamp_int }}
    steps:
      - id: set-timestamp
        run: |
          echo "timestamp=$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"
          echo "timestamp_int=$(date +'%s' | cut -c 1-9)" >> "$GITHUB_OUTPUT"
      
      - name: Clone repo
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          # Initializing and fetching manually to ensure the token is used for the push later
          git init
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/tatamu-fold/lucky-scan.git
          git fetch
          git checkout main

      - name: Update Version in pubspec.yaml
        run: |
          # Update Version in pubspec.yaml

          # 1. Extract the current version line
          VERSION_LINE=$(grep 'version: ' pubspec.yaml)
          FULL_VERSION=$(echo $VERSION_LINE | cut -d ' ' -f 2)
          
          # 2. Split into version (1.0.0) and build number (1)
          VERSION_PART=$(echo $FULL_VERSION | cut -d '+' -f 1)
          BUILD_PART=$(echo $FULL_VERSION | cut -d '+' -f 2)
          
          # 3. Split version into major, minor, patch
          MAJOR=$(echo $VERSION_PART | cut -d '.' -f 1)
          MINOR=$(echo $VERSION_PART | cut -d '.' -f 2)
          PATCH=$(echo $VERSION_PART | cut -d '.' -f 3)
          
          # 4. Increment values
          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD=$((BUILD_PART + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH+$NEW_BUILD"
          
          echo "Updating version from $FULL_VERSION to $NEW_VERSION"
          
          # 5. Write back to file
          sed -i "s/version: .*/version: $NEW_VERSION/" pubspec.yaml
          
          # 6. Push the change
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin main

  build_android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git init
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/iamCristYE/lucky-scan.git
          git fetch
          # Ensure we pull the fresh commit created in the 'prepare' job
          git checkout main
          git pull origin main

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: flutter pub get

      - name: Extract Version for Filenames
        id: get-version
        run: |
          # Extract version like 1.0.0+1
          FULL_VERSION=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          # Clean version for filename (replace + with - for compatibility)
          CLEAN_VERSION=$(echo $FULL_VERSION | tr '+' '-')
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: |
          # We remove --build-name and --build-number so Flutter uses pubspec.yaml defaults
          flutter build apk --release
          
          # Use the extracted version and timestamp for the filename
          mv build/app/outputs/flutter-apk/app-release.apk luckyscan_${{ steps.get-version.outputs.version }}_${{ needs.prepare.outputs.timestamp }}.apk

      - name: Build Mock Debug APK
        run: |
          flutter build apk --debug --dart-define=MOCK_API=true
          mv build/app/outputs/flutter-apk/app-debug.apk luckyscan_mock_${{ steps.get-version.outputs.version }}_${{ needs.prepare.outputs.timestamp }}.apk

      - name: Zip and Send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "-1002646331785"
          THREAD_ID: "4709"
          VER: ${{ steps.get-version.outputs.version }}
          TS: ${{ needs.prepare.outputs.timestamp }}
        run: |
          zip -9 "luckyscan_${VER}_${TS}.zip" "luckyscan_${VER}_${TS}.apk"
          zip -9 "luckyscan_mock_${VER}_${TS}.zip" "luckyscan_mock_${VER}_${TS}.apk"

          curl -F "chat_id=${CHAT_ID}" -F "message_thread_id=${THREAD_ID}" \
               -F "document=@luckyscan_${VER}_${TS}.zip" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

          curl -F "chat_id=${CHAT_ID}" -F "message_thread_id=${THREAD_ID}" \
               -F "document=@luckyscan_mock_${VER}_${TS}.zip" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
  build_ios:
    needs: prepare
    runs-on: macos-26
    steps:
      - name: Clone repo
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git init
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/tatamu-fold/lucky-scan.git
          git fetch
          git checkout origin/main

      - name: Install Apple Certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 21)

          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Removed '-t cert' to safely import both the cert and the private key
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # FIX: Directly set the keychain list without xargs string corruption
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # ADD THIS at the end of your Install Apple Certificate step
          # echo "--- Valid Code Signing Identities ---"
          # security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_FOLDER=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_FOLDER"
          
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/temp.mobileprovision
          
          UUID=$(security cms -D -i $RUNNER_TEMP/temp.mobileprovision | grep -A1 UUID | grep string | sed -E 's/<\/?string>//g' | tr -d '[:space:]')
          
          cp $RUNNER_TEMP/temp.mobileprovision "$PP_FOLDER/$UUID.mobileprovision"
          
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$HOME/flutter" >> $GITHUB_ENV

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build iOS app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Build iOS app

          # 1. Inject strict signing overrides directly into Flutter's config files
          echo "CODE_SIGN_STYLE=Manual" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=Apple Distribution" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM" >> ios/Flutter/Release.xcconfig

          # 2. Run the build (CLI flags kept as a fallback safety net)
          flutter build ipa --release \
            -t lib/main.dart \
            --export-options-plist=ios/ExportOptions.plist \
            -- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      # - name: Package unsigned IPA
      #   run: |
      #     mkdir -p build/ios/iphoneos/Payload
      #     cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
      #     cd build/ios/iphoneos
      #     zip -r luckyscan_${{ needs.prepare.outputs.timestamp }}.ipa Payload
      #     cd ../../..

      # - name: Send IPA to Telegram
      #   env:
      #     BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      #     CHAT_ID: "-1002646331785"
      #     THREAD_ID: "4709"
      #   run: |
      #     curl -F "chat_id=${CHAT_ID}" -F "message_thread_id=${THREAD_ID}" -F "document=@build/ios/iphoneos/luckyscan_${{ needs.prepare.outputs.timestamp }}.ipa" "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_CONTENT" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"