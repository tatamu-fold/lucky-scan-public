  build_ios:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Clone repo
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git init
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/tatamu-fold/lucky-scan.git
          git fetch
          git checkout origin/main

      - name: Install Apple Certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 21)

          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Removed '-t cert' to safely import both the cert and the private key
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # FIX: Directly set the keychain list without xargs string corruption
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_FOLDER=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PP_FOLDER"
          
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/temp.mobileprovision
          
          UUID=$(security cms -D -i $RUNNER_TEMP/temp.mobileprovision | grep -A1 UUID | grep string | sed -E 's/<\/?string>//g' | tr -d '[:space:]')
          
          cp $RUNNER_TEMP/temp.mobileprovision "$PP_FOLDER/$UUID.mobileprovision"
          
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$HOME/flutter" >> $GITHUB_ENV

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get



      - name: Build iOS app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Force Xcode project to use Manual signing
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/' ios/Runner.xcodeproj/project.pbxproj
          
          # FIX: Removed CODE_SIGN_IDENTITY to allow Xcode auto-detection
          flutter build ipa --release \
            -t lib/main.dart \
            --export-options-plist=ios/ExportOptions.plist \
            -- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PROVISIONING_PROFILE="$PROFILE_UUID"

      # - name: Package unsigned IPA
      #   run: |
      #     mkdir -p build/ios/iphoneos/Payload
      #     cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
      #     cd build/ios/iphoneos
      #     zip -r luckyscan_${{ needs.prepare.outputs.timestamp }}.ipa Payload
      #     cd ../../..

      # - name: Send IPA to Telegram
      #   env:
      #     BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      #     CHAT_ID: "-1002646331785"
      #     THREAD_ID: "4709"
      #   run: |
      #     curl -F "chat_id=${CHAT_ID}" -F "message_thread_id=${THREAD_ID}" -F "document=@build/ios/iphoneos/luckyscan_${{ needs.prepare.outputs.timestamp }}.ipa" "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_CONTENT" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          
          xcrun altool --upload-app --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"